<h1>{{ portalName }}</h1>

<p>Manage your courses, track your academic progress, and view your profile all in one place.</p>
<div>
  <strong>Courses Available:</strong> {{ coursesAvailable }} | <strong>Enrolled:</strong> 3 |
  <strong>GPA:</strong> 3.8
</div>

<hr />

<button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
<p>{{ message }}</p>

<input [(ngModel)]="searchTerm" placeholder="Search courses..." />
<p>Searching for: {{ searchTerm }}</p>
