<h2>Student Enrollment Request</h2>

<div *ngIf="submitted" style="color: green; font-weight: bold; margin-bottom: 15px">
  Enrollment request submitted successfully!
</div>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
  <div>
    <label for="studentName">Student Name:</label>
    <input
      type="text"
      id="studentName"
      name="studentName"
      [(ngModel)]="studentNameInput"
      required
      minlength="3"
      #nameCtrl="ngModel"
    />

    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']" class="error-text">
      Name is required
    </span>
    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']" class="error-text">
      Name must be at least 3 characters
    </span>
  </div>

  <div>
    <label for="studentEmail">Student Email:</label>
    <input
      type="email"
      id="studentEmail"
      name="studentEmail"
      [(ngModel)]="studentEmailInput"
      required
      email
    />
  </div>

  <div>
    <label for="courseId">Course ID:</label>
    <input type="number" id="courseId" name="courseId" [(ngModel)]="courseIdInput" required />
  </div>

  <div>
    <label for="preferredSemester">Preferred Semester:</label>
    <select id="preferredSemester" name="preferredSemester" [(ngModel)]="semesterInput">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div>
    <label>
      <input type="checkbox" name="agreeToTerms" [(ngModel)]="agreeInput" required />
      I agree to the terms and conditions
    </label>
  </div>

  <button type="submit" [disabled]="enrollForm.invalid">Submit</button>

  <button type="button" (click)="enrollForm.resetForm(); submitted = false">Reset</button>
</form>
