<h2>Available Courses</h2>

<div style="margin-bottom: 20px">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearch()"
    placeholder="Search courses..."
    style="padding: 8px; width: 100%; max-width: 300px; border-radius: 4px; border: 1px solid #ccc"
  />
</div>

<p *ngIf="isLoading">Loading courses...</p>

<ng-container *ngIf="!isLoading">
  <ng-container *ngIf="courses.length > 0; else noCourses">
    <button
      (click)="addDummyCourse()"
      style="
        margin-bottom: 15px;
        padding: 8px 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      "
    >
      Add Test Course
    </button>
    <app-course-summary-widget></app-course-summary-widget>
    <app-course-card
      *ngFor="let course of courses; let i = index; trackBy: trackByCourseId"
      [course]="course"
      (enrollRequested)="onEnroll($event)"
      (click)="viewCourseDetails(course.id)"
      appHighlight="lightblue"
      style="cursor: pointer; display: block; margin-bottom: 15px"
    >
    </app-course-card>
  </ng-container>
</ng-container>

<ng-template #noCourses>
  <p>No courses available.</p>
</ng-template>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
