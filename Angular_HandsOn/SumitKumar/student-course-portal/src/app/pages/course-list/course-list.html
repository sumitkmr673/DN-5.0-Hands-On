<h2>Available Courses</h2>

<div style="margin-bottom: 20px">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearch()"
    placeholder="Search courses..."
    style="padding: 8px; width: 100%; max-width: 300px; border-radius: 4px; border: 1px solid #ccc"
  />
</div>

<p *ngIf="isLoading$ | async">Loading courses...</p>

<div
  *ngIf="errorMessage$ | async as errorMessage"
  style="
    color: red;
    padding: 10px;
    border: 1px solid red;
    margin-bottom: 15px;
    background-color: #fee;
  "
>
  <strong>Error:</strong> {{ errorMessage }}
</div>

<ng-container *ngIf="!(isLoading$ | async) && !(errorMessage$ | async)">
  <ng-container *ngIf="(courses$ | async)?.length; else noCourses">
    <button
      (click)="addDummyCourse()"
      style="
        margin-bottom: 15px;
        padding: 8px 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      "
    >
      Add Test Course
    </button>
    <app-course-summary-widget></app-course-summary-widget>
    <app-course-card
      *ngFor="let course of courses$ | async; let i = index; trackBy: trackByCourseId"
      [course]="course"
      (enrollRequested)="onEnroll($event)"
      (delete)="onDelete($event)"
      (click)="viewCourseDetails(course.id)"
      appHighlight="lightblue"
      style="cursor: pointer; display: block; margin-bottom: 15px"
    >
    </app-course-card>
  </ng-container>
</ng-container>

<ng-template #noCourses>
  <p *ngIf="!(errorMessage$ | async)">No courses available.</p>
</ng-template>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>

<div
  *ngIf="studentsForCourse.length > 0"
  style="margin-top: 10px; padding: 10px; background-color: #e8f5e9; border-radius: 4px"
>
  <strong>Students enrolled in selected course:</strong>
  <ul>
    <li *ngFor="let student of studentsForCourse">{{ student }}</li>
  </ul>
</div>
