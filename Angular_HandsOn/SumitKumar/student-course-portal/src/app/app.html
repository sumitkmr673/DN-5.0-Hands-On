<div
  *ngIf="loadingService.isLoading$ | async"
  class="global-spinner-overlay"
  style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.7);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  "
>
  <div
    style="padding: 20px; background: #007bff; color: white; border-radius: 8px; font-weight: bold"
  >
    Loading...
  </div>
</div>
